name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      client_id:
        description: Client ID (for example, downtown-coffee-house)
        required: true
        type: string
      platform:
        description: Installer platforms
        required: true
        default: both
        type: choice
        options:
          - both
          - linux
          - macos

permissions:
  contents: read

jobs:
  linux:
    if: inputs.platform == 'both' || inputs.platform == 'linux'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.client_id }}
    timeout-minutes: 45
    steps:
      - name: Require private source repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error::Make the source repository private before building client installers with credentials."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Select client and restore provisioning
        env:
          POS_PROVISIONING_B64: ${{ secrets.POS_PROVISIONING_B64 }}
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          node frontend/scripts/select-client.cjs "$CLIENT_ID"
          node frontend/scripts/restore-ci-provisioning.cjs "$CLIENT_ID"
          npm run client:check --prefix frontend
      - name: Build Linux AppImage
        run: npm run desktop:dist:linux --prefix frontend
      - name: Upload Linux installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client_id }}-linux-x64
          path: frontend/release/${{ inputs.client_id }}/linux/latest-version/*.AppImage
          if-no-files-found: error
          retention-days: 14

  macos:
    if: inputs.platform == 'both' || inputs.platform == 'macos'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.client_id }}
    timeout-minutes: 90
    steps:
      - name: Require private source repository
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$IS_PRIVATE" != "true" ]; then
            echo "::error::Make the source repository private before building client installers with credentials."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci --prefix backend
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Select client and restore provisioning
        env:
          POS_PROVISIONING_B64: ${{ secrets.POS_PROVISIONING_B64 }}
          CLIENT_ID: ${{ inputs.client_id }}
        run: |
          node frontend/scripts/select-client.cjs "$CLIENT_ID"
          node frontend/scripts/restore-ci-provisioning.cjs "$CLIENT_ID"
          npm run client:check --prefix frontend
      - name: Require Apple signing and notarization credentials
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing macOS signing secret: $name"
              exit 1
            fi
          done
      - name: Build signed and notarized Mac installer
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:dist:mac --prefix frontend
      - name: Upload Mac installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.client_id }}-macos-${{ matrix.architecture }}
          path: |
            frontend/release/${{ inputs.client_id }}/macos/latest-version/*.dmg
            frontend/release/${{ inputs.client_id }}/macos/latest-version/*.zip
          if-no-files-found: error
          retention-days: 14
